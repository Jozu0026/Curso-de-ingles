            { en: "Student backpack", pron: "stiúdent bákpák", es: "Mochila del alumno" },
            { en: "Whiteboard marker", pron: "uáitbord márker", es: "Marcador de pizarra" },
            { en: "Paper sheet", pron: "péiper shít", es: "Hoja de papel" },
            { en: "English class", pron: "ínglish klás", es: "Clase de inglés" },
            { en: "Saturday course", pron: "sáterdei kórs", es: "Curso del sábado" }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('card');
        const wordEnElement = document.getElementById('word-en');
        const wordBackEnElement = document.getElementById('word-back-en');
        const pronEnElement = document.getElementById('pron-en');
        const wordEsElement = document.getElementById('word-es');
        const counterElement = document.getElementById('counter');

        function handleCardClick() {
            cardElement.classList.toggle('flipped');
        }

        function updateCard() {
            cardElement.classList.remove('flipped');
            
            setTimeout(() => {
                const currentWord = vocabulary[currentIndex];
                wordEnElement.innerText = currentWord.en;
                wordBackEnElement.innerText = currentWord.en;
                pronEnElement.innerText = currentWord.pron;
                wordEsElement.innerText = currentWord.es;
                counterElement.innerText = `${currentIndex + 1} / ${vocabulary.length}`;
            }, 100);
        }

        function nextCard(event) {
            event.stopPropagation(); 
            if (currentIndex < vocabulary.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; 
            }
            updateCard();
        }

        function prevCard(event) {
            event.stopPropagation(); 
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = vocabulary.length - 1; 
            }
            updateCard();
        }

        window.onload = function() {
            const currentWord = vocabulary[currentIndex];
            wordEnElement.innerText = currentWord.en;
            wordBackEnElement.innerText = currentWord.en;
            pronEnElement.innerText = currentWord.pron;
            wordEsElement.innerText = currentWord.es;
            counterElement.innerText = `1 / ${vocabulary.length}`;
        };
    </script>

</body>
