<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Curso de Inglés de los Sábados 📚</title>
    <style>
        /* 🎨 DISEÑO ESTILO APP MÓVIL PREMIUM */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a; 
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background-color: #1e293b;
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #334155;
        }

        /* 👑 TÍTULO PRINCIPAL */
        .main-title {
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #f43f5e, #eab308); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        /* ✨ SUBTÍTULO */
        .motivation-subtitle {
            font-size: 15px;
            color: #f8fafc;
            margin-bottom: 25px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 12px 15px;
            border-radius: 16px;
            border: 2px solid #38bdf8; 
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.15);
            line-height: 1.4;
        }

        /* 🎛️ ESTILOS DEL MENÚ PRINCIPAL */
        .menu-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .menu-card {
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #475569;
            border-radius: 20px;
            padding: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .menu-card:active {
            transform: scale(0.96);
            border-color: #38bdf8;
        }

        .menu-icon {
            font-size: 42px;
            background-color: rgba(15, 23, 42, 0.4);
            padding: 10px;
            border-radius: 15px;
        }

        .menu-info h2 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .menu-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* 📄 ESTILOS DE LAS VENTANAS DE CONTENIDO */
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 👶 TEXTO EXPLICATIVO PARA NIÑOS */
        .kids-intro {
            background-color: #0f172a;
            border-radius: 18px;
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
            text-align: left;
            margin-bottom: 20px;
            border-left: 5px solid #eab308;
        }

        /* 🖼️ ILUSTRACIONES EDUCATIVAS CON EMOJIS */
        .kids-poster {
            font-size: 65px;
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 2px solid #334155;
            display: flex;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 📊 TABLAS DE DATOS EN GRANDE Y LEGIBLES PARA MÓVIL */
        .grammar-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .grammar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #334155;
            gap: 10px;
        }

        .word-column {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .lang-en {
            font-size: 25px;
            font-weight: 800;
            color: #38bdf8;
            line-height: 1.1;
        }

        /* 🗣️ PRONUNCIACIÓN ULTRA LLAMATIVA EN PANTALLA MÓVIL */
        .lang-pron {
            font-size: 14px;
            font-weight: 700;
            color: #fef08a; /* Amarillo neón */
            background-color: rgba(234, 179, 8, 0.15);
            padding: 3px 8px;
            border-radius: 8px;
            margin-top: 5px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(254, 240, 138, 0.2);
        }

        .lang-es {
            font-size: 19px;
            font-weight: 700;
            color: #10b981;
            text-align: right;
            word-break: break-word;
        }

        /* 🔘 BOTÓN DE REGRESAR AL MENÚ */
        .btn-back {
            width: 100%;
            background-color: #f43f5e;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-back:active {
            background-color: #be123c;
            transform: scale(0.98);
        }

        /* Estilo para los bloques de ejemplo Verbo To Be */
        .example-box {
            background
